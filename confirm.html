<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HighVault — Email Confirmed</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a12;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .logo {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 32px;
    }
    .logo .high { color: #3b8bf5; }
    .logo .vault { color: #9b5cf6; }
    .checkmark {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0a1f12, #0d3020);
      border: 2px solid #22c55e;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 36px;
      animation: pulse 1s ease-in-out 3;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    h1 {
      font-size: 24px;
      color: #22c55e;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      color: #888;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #1a3a6a, #2a1a5a);
      border: 1px solid #3b8bf5;
      color: #3b8bf5;
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 16px;
    }
    .note {
      font-size: 12px;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <span class="high">HIGH</span><span class="vault">VAULT</span>
    </div>
    <div class="checkmark">✅</div>
    <h1>Email Verified! 🎉</h1>
    <p>Your HighVault account is ready.<br>Go back to the app to start learning.</p>
    <a href="com.highvault.futminna://" class="btn">Open HighVault →</a>
    <p class="note">If the button doesn't work, simply open the HighVault app manually and log in.</p>
  </div>
</body>
</html>
